# Runtime Arena server. Usage: cp .env.example .env && docker compose up -d
services:
  arena:
    image: ghcr.io/hugoocoto/runtime-arena-server:${ARENA_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    # isolate creates namespaces and cgroups for every sandbox; this needs a
    # privileged container with its own cgroup namespace. See SECURITY.md.
    privileged: true
    cgroup: private
    ports:
      - "${ARENA_PORT:-8080}:8080"
    environment:
      ARENA_ADMIN_TOKEN: ${ARENA_ADMIN_TOKEN:?set ARENA_ADMIN_TOKEN in .env (openssl rand -hex 32)}
      ARENA_JOIN_CODE: ${ARENA_JOIN_CODE:-}
      JUDGE_CPUS: ${JUDGE_CPUS:-}
      ARENA_UPDATE_CHECK: ${ARENA_UPDATE_CHECK:-on}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - arena-data:/data
    restart: unless-stopped

volumes:
  arena-data:
