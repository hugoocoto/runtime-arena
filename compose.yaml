# Runtime Arena server and automatic HTTPS proxy.
# Usage: cp .env.example .env && docker compose up -d
services:
  arena:
    image: ghcr.io/hugoocoto/runtime-arena-server:${ARENA_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    # isolate creates namespaces and cgroups for every sandbox; this needs a
    # privileged container with its own cgroup namespace. See SECURITY.md.
    privileged: true
    cgroup: private
    ports:
      # Local-only access is retained for the organiser's admin CLI. Participants
      # use Caddy on HTTPS below.
      - "127.0.0.1:${ARENA_PORT:-8080}:8080"
    environment:
      ARENA_ADMIN_TOKEN: ${ARENA_ADMIN_TOKEN:?set ARENA_ADMIN_TOKEN in .env (openssl rand -hex 32)}
      ARENA_JOIN_CODE: ${ARENA_JOIN_CODE:-}
      JUDGE_CPUS: ${JUDGE_CPUS:-}
      ARENA_PROCESSES: ${ARENA_PROCESSES:-64}
      ARENA_MAX_FAILURES: ${ARENA_MAX_FAILURES:-3}
      ARENA_DISK_MB: ${ARENA_DISK_MB:-512}
      ARENA_UPDATE_CHECK: ${ARENA_UPDATE_CHECK:-on}
      ARENA_RATE_LIMIT: ${ARENA_RATE_LIMIT:-200}
      # Caddy reaches the server through the published port, so every
      # connection comes from the container's gateway. Trusting it lets the
      # limits count the participant's address from X-Forwarded-For instead.
      ARENA_TRUSTED_PROXIES: ${ARENA_TRUSTED_PROXIES:-gateway}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - arena-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    # Binds ports 80 and 443 on the host. Clients send no TLS server name when
    # connecting to an IP, so Caddy picks the certificate by the address they
    # connected to, which it can only see on the host network.
    network_mode: host
    depends_on:
      arena:
        condition: service_started
    environment:
      ARENA_DOMAIN: ${ARENA_DOMAIN:-localhost}
      ARENA_UPSTREAM: 127.0.0.1:${ARENA_PORT:-8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  arena-data:
  caddy-data:
  caddy-config:
