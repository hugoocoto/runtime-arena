[package]
name = "arena-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
arena-protocol = { path = "../protocol" }
clap = { version = "4.6.9", features = ["derive", "env"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
flate2 = "1.1.11"
futures-util = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart", "query", "http2"] }
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
webpki-roots = "1.0.12"

[lints]
workspace = true

[[bin]]
name = "arena"
path = "src/main.rs"

[dev-dependencies]
arena-judge = { path = "../judge" }
arena-server = { path = "../server" }
axum = "0.8.9"
tempfile = "3.27.0"
