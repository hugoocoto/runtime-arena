name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    attributes:
      label: Version (arena --version, image tag)
  - type: textarea
    attributes:
      label: Host (OS, kernel, `docker info --format '{{.CgroupVersion}}'`, CPU)
